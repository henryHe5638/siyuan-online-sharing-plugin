<!doctype html>
<html lang="zh-CN" data-theme-mode="light">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
    <meta name="referrer" content="no-referrer"/>
    <title>分享</title>
    <link rel="stylesheet" id="share-theme-style"/>
</head>
<body>
<svg class="share-icon-sprite" aria-hidden="true">
    <defs>
        <symbol id="iconDot" viewBox="0 0 20 20">
            <path d="M5.501 9.999c0 2.485 2.016 4.499 4.501 4.499s4.497-2.016 4.497-4.499c0-2.485-2.012-4.497-4.497-4.497s-4.501 2.012-4.501 4.497z"/>
        </symbol>
        <symbol id="iconCopy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
            <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v4"/>
            <path d="M21 14H11"/>
            <path d="m15 10-4 4 4 4"/>
        </symbol>
        <symbol id="iconCheck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="m9 12 2 2 4-4"/>
        </symbol>
    </defs>
</svg>
<div id="app" class="share-app">
    <header class="share-header">
        <button id="nav-toggle" class="share-icon-button" type="button" aria-label="文档树" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="share-header__title" id="share-title" title="">分享</div>
        <div class="share-header__actions">
            <button id="code-wrap-toggle" class="share-icon-button" type="button" aria-label="代码块自动换行" aria-pressed="true" title="代码块自动换行">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10a4 4 0 0 1 0 8H8"/><path d="m11 17-3 3 3 3"/></svg>
            </button>
            <button id="lock-button" class="share-icon-button" type="button" aria-label="锁定" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </button>
            <button id="theme-toggle" class="share-icon-button" type="button" aria-label="切换主题">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button id="copy-link" class="share-icon-button" type="button" aria-label="复制当前链接">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"/></svg>
            </button>
        </div>
    </header>

    <div class="share-body">
        <aside id="sidebar" class="share-sidebar" aria-label="导航">
            <div class="share-sidebar-tabs" role="tablist" aria-label="导航视图">
                <button id="tab-outline" class="share-sidebar-tab is-active" type="button" role="tab" aria-selected="true" data-tab="outline">目录</button>
                <button id="tab-docs" class="share-sidebar-tab" type="button" role="tab" aria-selected="false" data-tab="docs">文档列表</button>
            </div>
            <nav id="doc-tree" class="share-tree" aria-label="文档列表" hidden></nav>
            <nav id="outline" class="share-outline" aria-label="当前文档目录"></nav>
        </aside>
        <div id="sidebar-resizer" class="share-sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度"></div>
        <div id="sidebar-backdrop" class="share-sidebar-backdrop" hidden></div>

        <main class="share-main" id="share-main">
            <div id="share-loading" class="share-loading" hidden>
                <div class="share-spinner" aria-hidden="true"></div>
                <div>正在加载…</div>
            </div>
            <div id="share-error" class="share-error" hidden></div>
            <div class="share-content">
                <article id="content" class="protyle-wysiwyg" data-readonly="true" hidden></article>
            </div>
        </main>
    </div>

    <div id="password-overlay" class="share-overlay" hidden>
        <form id="password-form" class="share-password-card" autocomplete="off">
            <div class="share-password-card__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </div>
            <h1 class="share-password-card__title">需要密码</h1>
            <p class="share-password-card__desc">这个分享设置了访问密码。</p>
            <label class="share-field">
                <span>密码</span>
                <input id="password-input" type="password" inputmode="text" autocomplete="current-password" required/>
            </label>
            <div id="password-error" class="share-password-card__error" hidden></div>
            <button id="password-submit" class="share-primary-button" type="submit">解锁</button>
        </form>
    </div>

    <div id="toast" class="share-toast" role="status" aria-live="polite" hidden></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
